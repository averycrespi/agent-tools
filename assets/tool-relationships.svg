<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="740" viewBox="0 0 1350 740" role="img" aria-labelledby="title desc">
  <title id="title">Agent Tools relationship diagram</title>
  <desc id="desc">Diagram showing host tools around a Lima sandbox, Worktree Sync observing host-visible Git worktrees and controlling isolated tmux resources, a host worktree mounted into the sandbox, and MCP and proxy traffic through host services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .group { stroke-width: 2; rx: 18; }
      .host { fill: #eff6ff; stroke: #93c5fd; }
      .sandbox { fill: #fff7ed; stroke: #fdba74; }
      .node { stroke-width: 2; rx: 12; }
      .host-node { fill: #e0f2fe; stroke: #0284c7; }
      .sandbox-node { fill: #ffedd5; stroke: #f97316; }
      .workspace-node { fill: #f3e8ff; stroke: #9333ea; }
      .external-node { fill: #f1f5f9; stroke: #64748b; }
      .title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .mcp { fill: none; stroke: #0284c7; stroke-width: 2.5; marker-end: url(#arrow); }
      .proxy { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .mount { fill: none; stroke: #9333ea; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .edge-label { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .label-bg { fill: #eff6ff; opacity: 0.95; rx: 4; }
      .legend-text { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="canvas" width="1350" height="740" />
  <text class="title" x="40" y="42">How the tools fit together</text>

  <rect class="group host" x="40" y="95" width="1270" height="555" />
  <text class="title" x="70" y="130">Host machine</text>

  <g transform="translate(0 -80)">
  <rect class="group sandbox" x="490" y="295" width="310" height="255" />
  <text class="title" x="610" y="328" text-anchor="middle">Lima sandbox</text>

  <rect class="node host-node" x="85" y="465" width="150" height="58" />
  <text class="label" x="160" y="494">Worktree Manager</text>

  <rect class="node host-node" x="85" y="570" width="150" height="58" />
  <text class="label" x="160" y="599">Worktree Sync</text>

  <rect class="node workspace-node" x="295" y="570" width="150" height="58" />
  <text class="label" x="370" y="590">Managed wts</text>
  <text class="label" x="370" y="608">tmux resources</text>

  <rect class="node host-node" x="295" y="360" width="150" height="58" />
  <text class="label" x="370" y="389">Sandbox Manager</text>

  <rect class="node workspace-node" x="295" y="465" width="150" height="58" />
  <text class="label" x="370" y="494">Host worktree</text>

  <rect class="node sandbox-node" x="570" y="360" width="150" height="58" />
  <text class="label" x="645" y="389">Pi coding agent</text>

  <rect class="node workspace-node" x="570" y="465" width="150" height="58" />
  <text class="label" x="645" y="494">Mounted worktree</text>

  <rect class="node host-node" x="940" y="275" width="150" height="58" />
  <text class="label" x="1015" y="304">MCP Broker</text>

  <rect class="node host-node" x="940" y="385" width="150" height="50" />
  <text class="label" x="1015" y="410">Local Git MCP</text>

  <rect class="node host-node" x="940" y="475" width="150" height="50" />
  <text class="label" x="1015" y="500">Telegram MCP</text>

  <rect class="node host-node" x="940" y="585" width="150" height="58" />
  <text class="label" x="1015" y="614">Local Gomod Proxy</text>

  <rect class="node external-node" x="1135" y="385" width="115" height="50" />
  <text class="label" x="1192" y="410">Git remotes</text>

  <rect class="node external-node" x="1135" y="475" width="115" height="50" />
  <text class="label" x="1192" y="500">Telegram</text>

  <rect class="node external-node" x="1135" y="589" width="115" height="50" />
  <text class="label" x="1192" y="614">Go modules</text>

  <path class="edge" d="M235 494 L292 494" />
  <path class="edge" d="M235 570 L330 523" />
  <rect class="label-bg" x="244" y="534" width="65" height="18" />
  <text class="edge-label" x="276" y="547">observes</text>
  <path class="edge" d="M235 599 L292 599" />
  <path class="edge" d="M445 389 L567 389" />

  <path class="mount" d="M445 494 L567 494" />
  <rect class="label-bg" x="488" y="466" width="76" height="18" />
  <text class="edge-label" x="526" y="479">Lima mount</text>
  <path class="edge" d="M645 418 L645 462" />

  <path class="mcp" d="M720 389 L937 304" />
  <rect class="label-bg" x="770" y="328" width="70" height="18" />
  <text class="edge-label" x="805" y="341">MCP calls</text>
  <path class="mcp" d="M1015 333 L1015 382" />
  <path class="mcp" d="M990 333 L900 333 L900 500 L937 500" />
  <path class="proxy" d="M720 404 L937 614" />
  <rect class="label-bg" x="770" y="462" width="66" height="18" />
  <text class="edge-label" x="803" y="475">GOPROXY</text>

  <path class="edge" d="M1090 410 L1132 410" />
  <path class="edge" d="M1090 500 L1132 500" />
  <path class="edge" d="M1090 614 L1132 614" />
  </g>

  <rect class="node host-node" x="40" y="700" width="14" height="14" />
  <text class="legend-text" x="62" y="712">Host tool</text>
  <rect class="node sandbox-node" x="145" y="700" width="14" height="14" />
  <text class="legend-text" x="167" y="712">Sandbox runtime</text>
  <rect class="node workspace-node" x="295" y="700" width="14" height="14" />
  <text class="legend-text" x="317" y="712">Local data/workspace</text>
  <rect class="node external-node" x="480" y="700" width="14" height="14" />
  <text class="legend-text" x="502" y="712">External service</text>
</svg>
