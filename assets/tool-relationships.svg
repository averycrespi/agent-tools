<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="650" viewBox="0 0 1350 650" role="img" aria-labelledby="title desc">
  <title id="title">Agent Tools relationship diagram</title>
  <desc id="desc">Diagram showing host tools around a Lima sandbox, with a host worktree mounted into the sandbox, and MCP/proxy/notification traffic routed through host-side services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .group { stroke-width: 2; rx: 18; }
      .host { fill: #eff6ff; stroke: #93c5fd; }
      .sandbox { fill: #fff7ed; stroke: #fdba74; }
      .node { stroke-width: 2; rx: 12; }
      .host-node { fill: #e0f2fe; stroke: #0284c7; }
      .sandbox-node { fill: #ffedd5; stroke: #f97316; }
      .workspace-node { fill: #f3e8ff; stroke: #9333ea; }
      .external-node { fill: #f1f5f9; stroke: #64748b; }
      .title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .mcp { fill: none; stroke: #0284c7; stroke-width: 2.5; marker-end: url(#arrow); }
      .proxy { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .mount { fill: none; stroke: #9333ea; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .edge-label { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .label-bg { fill: #eff6ff; opacity: 0.95; rx: 4; }
      .legend-text { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="canvas" width="1350" height="650" />
  <text class="title" x="40" y="42">How the tools fit together</text>

  <rect class="group host" x="40" y="95" width="1270" height="466" />
  <text class="title" x="70" y="130">Host machine</text>

  <rect class="group sandbox" x="490" y="175" width="310" height="265" />
  <text class="title" x="610" y="208" text-anchor="middle">Lima sandbox</text>

  <rect class="node host-node" x="85" y="355" width="150" height="58" />
  <text class="label" x="160" y="384">Worktree Manager</text>

  <rect class="node host-node" x="295" y="250" width="150" height="58" />
  <text class="label" x="370" y="279">Sandbox Manager</text>

  <rect class="node workspace-node" x="295" y="355" width="150" height="58" />
  <text class="label" x="370" y="384">Host worktree</text>

  <rect class="node sandbox-node" x="570" y="250" width="150" height="58" />
  <text class="label" x="645" y="279">Pi coding agent</text>

  <rect class="node workspace-node" x="570" y="355" width="150" height="58" />
  <text class="label" x="645" y="384">Mounted worktree</text>

  <rect class="node host-node" x="940" y="165" width="150" height="58" />
  <text class="label" x="1015" y="194">MCP Broker</text>

  <rect class="node host-node" x="940" y="275" width="150" height="50" />
  <text class="label" x="1015" y="300">Local Git MCP</text>

  <rect class="node host-node" x="1135" y="165" width="115" height="58" />
  <text class="label" x="1192" y="186">Hindsight</text>
  <text class="label" x="1192" y="204">MCP</text>

  <rect class="node host-node" x="940" y="365" width="150" height="50" />
  <text class="label" x="1015" y="390">Telegram MCP</text>

  <rect class="node host-node" x="940" y="475" width="150" height="58" />
  <text class="label" x="1015" y="504">Local Gomod Proxy</text>

  <rect class="node external-node" x="1135" y="275" width="115" height="50" />
  <text class="label" x="1192" y="300">Git remotes</text>

  <rect class="node external-node" x="1135" y="365" width="115" height="50" />
  <text class="label" x="1192" y="390">Telegram</text>

  <rect class="node external-node" x="1135" y="479" width="115" height="50" />
  <text class="label" x="1192" y="504">Go modules</text>

  <path class="edge" d="M235 384 L292 384" />
  <path class="edge" d="M445 279 L567 279" />

  <path class="mount" d="M445 384 L567 384" />
  <rect class="label-bg" x="488" y="356" width="76" height="18" />
  <text class="edge-label" x="526" y="369">Lima mount</text>
  <path class="edge" d="M645 308 L645 352" />

  <path class="mcp" d="M720 279 L937 194" />
  <rect class="label-bg" x="770" y="218" width="70" height="18" />
  <text class="edge-label" x="805" y="231">MCP calls</text>
  <path class="mcp" d="M1015 223 L1015 272" />
  <path class="mcp" d="M1090 194 L1132 194" />
  <path class="mcp" d="M990 223 L900 223 L900 390 L937 390" />
  <path class="proxy" d="M720 294 L937 504" />
  <rect class="label-bg" x="770" y="386" width="66" height="18" />
  <text class="edge-label" x="803" y="399">GOPROXY</text>

  <path class="edge" d="M1090 300 L1132 300" />
  <path class="edge" d="M1090 390 L1132 390" />
  <path class="edge" d="M1090 504 L1132 504" />

  <rect class="node host-node" x="40" y="615" width="14" height="14" />
  <text class="legend-text" x="62" y="627">Host tool</text>
  <rect class="node sandbox-node" x="145" y="615" width="14" height="14" />
  <text class="legend-text" x="167" y="627">Sandbox runtime</text>
  <rect class="node workspace-node" x="295" y="615" width="14" height="14" />
  <text class="legend-text" x="317" y="627">Shared workspace</text>
  <rect class="node external-node" x="455" y="615" width="14" height="14" />
  <text class="legend-text" x="477" y="627">External service</text>
</svg>
