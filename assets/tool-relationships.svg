<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="650" viewBox="0 0 1350 650" role="img" aria-labelledby="title desc">
  <title id="title">Agent Tools relationship diagram</title>
  <desc id="desc">Diagram showing host tools around a Lima sandbox, with a host worktree mounted into the sandbox and MCP/proxy traffic routed through host-side services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .group { stroke-width: 2; rx: 18; }
      .host { fill: #eff6ff; stroke: #93c5fd; }
      .sandbox { fill: #fff7ed; stroke: #fdba74; }
      .node { stroke-width: 2; rx: 12; }
      .host-node { fill: #e0f2fe; stroke: #0284c7; }
      .sandbox-node { fill: #ffedd5; stroke: #f97316; }
      .workspace-node { fill: #f3e8ff; stroke: #9333ea; }
      .external-node { fill: #f1f5f9; stroke: #64748b; }
      .title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .mcp { fill: none; stroke: #0284c7; stroke-width: 2.5; marker-end: url(#arrow); }
      .proxy { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .mount { fill: none; stroke: #9333ea; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .edge-label { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .label-bg { fill: #eff6ff; opacity: 0.95; rx: 4; }
      .legend-text { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="canvas" width="1350" height="650" />
  <text class="title" x="40" y="42">How the tools fit together</text>

  <rect class="group host" x="40" y="95" width="1270" height="466" />
  <text class="title" x="70" y="130">Host machine</text>

  <rect class="group sandbox" x="490" y="155" width="310" height="265" />
  <text class="title" x="610" y="188" text-anchor="middle">Lima sandbox</text>

  <rect class="node host-node" x="85" y="220" width="150" height="58" />
  <text class="label" x="160" y="249">Pi Dispatcher</text>

  <rect class="node host-node" x="85" y="335" width="150" height="58" />
  <text class="label" x="160" y="364">Worktree Manager</text>

  <rect class="node host-node" x="295" y="220" width="150" height="58" />
  <text class="label" x="370" y="249">Sandbox Manager</text>

  <rect class="node workspace-node" x="295" y="335" width="150" height="58" />
  <text class="label" x="370" y="364">Host worktree</text>

  <rect class="node sandbox-node" x="570" y="220" width="150" height="58" />
  <text class="label" x="645" y="249">Pi coding agent</text>

  <rect class="node workspace-node" x="570" y="335" width="150" height="58" />
  <text class="label" x="645" y="364">Mounted worktree</text>

  <rect class="node host-node" x="940" y="145" width="150" height="58" />
  <text class="label" x="1015" y="174">MCP Broker</text>

  <rect class="node host-node" x="940" y="255" width="150" height="50" />
  <text class="label" x="1015" y="280">Local Git MCP</text>

  <rect class="node host-node" x="1135" y="145" width="115" height="58" />
  <text class="label" x="1192" y="174">Hindsight</text>

  <rect class="node host-node" x="940" y="455" width="150" height="58" />
  <text class="label" x="1015" y="484">Local Gomod Proxy</text>

  <rect class="node external-node" x="967" y="345" width="95" height="50" />
  <text class="label" x="1015" y="370">Git remotes</text>

  <rect class="node external-node" x="1135" y="459" width="115" height="50" />
  <text class="label" x="1192" y="484">Go modules</text>

  <path class="edge" d="M160 278 L160 332" />
  <path class="edge" d="M235 249 L292 249" />
  <path class="edge" d="M235 364 L292 364" />
  <path class="edge" d="M445 249 L567 249" />

  <path class="mount" d="M445 364 L567 364" />
  <rect class="label-bg" x="488" y="336" width="76" height="18" />
  <text class="edge-label" x="526" y="349">Lima mount</text>
  <path class="edge" d="M645 278 L645 332" />

  <path class="mcp" d="M720 249 L937 174" />
  <rect class="label-bg" x="770" y="198" width="70" height="18" />
  <text class="edge-label" x="805" y="211">MCP calls</text>
  <path class="mcp" d="M1015 203 L1015 252" />
  <path class="mcp" d="M1090 174 L1132 174" />
  <path class="proxy" d="M720 264 L937 484" />
  <rect class="label-bg" x="770" y="366" width="66" height="18" />
  <text class="edge-label" x="803" y="379">GOPROXY</text>

  <path class="edge" d="M1015 305 L1015 342" />
  <path class="edge" d="M1090 484 L1132 484" />

  <rect class="node host-node" x="40" y="615" width="14" height="14" />
  <text class="legend-text" x="62" y="627">Host tool</text>
  <rect class="node sandbox-node" x="145" y="615" width="14" height="14" />
  <text class="legend-text" x="167" y="627">Sandbox runtime</text>
  <rect class="node workspace-node" x="295" y="615" width="14" height="14" />
  <text class="legend-text" x="317" y="627">Shared workspace</text>
  <rect class="node external-node" x="455" y="615" width="14" height="14" />
  <text class="legend-text" x="477" y="627">External service</text>
</svg>
