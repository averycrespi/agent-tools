name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tools: ${{ steps.select.outputs.tools }}
      integration: ${{ steps.select.outputs.integration }}
      e2e: ${{ steps.select.outputs.e2e }}
      gateway: ${{ steps.select.outputs.gateway }}
      sandbox: ${{ steps.select.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make test-ci
      - id: select
        run: python3 -B .github/scripts/ci.py select

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          role: quality
          tool: all
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make fmt-check

  unit-tests:
    name: Go checks (${{ matrix.tool }}, Linux)
    needs: changes
    if: needs.changes.outputs.tools != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
    env:
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          role: unit
          tool: ${{ matrix.tool }}
      - uses: actions/setup-node@v4
        if: matrix.tool == 'mcp-gateway'
        with:
          node-version: 24
      - name: Lint
        if: matrix.tool != 'mcp-gateway'
        run: make -C "$TOOL" lint
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          if [ "$TOOL" = mcp-gateway ]; then
            make -C "$TOOL" test-unit
          else
            make -C "$TOOL" test
          fi

  gateway-lint:
    name: Gateway lint
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          role: lint
          tool: mcp-gateway
      - run: make -C mcp-gateway lint

  sandbox-manager-macos:
    name: Sandbox Manager tests (macOS)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          role: macos
          tool: sandbox-manager
      - run: make -C sandbox-manager test

  integration-tests:
    name: Integration tests (${{ matrix.tool }})
    needs: changes
    if: needs.changes.outputs.integration != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.integration) }}
    env:
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          role: integration
          tool: ${{ matrix.tool }}
      - run: make -C "$TOOL" test-integration

  e2e-tests:
    name: End-to-end tests (${{ matrix.tool }})
    needs: changes
    if: needs.changes.outputs.e2e != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.e2e) }}
    env:
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          role: e2e
          tool: ${{ matrix.tool }}
      - name: Prepare Gateway E2E build cache
        if: matrix.tool == 'mcp-gateway'
        timeout-minutes: 5
        run: go -C "$TOOL" build -tags=e2e -o /dev/null ./cmd/mcp-gateway
      - run: make -C "$TOOL" test-e2e

  gateway-temporary:
    name: Gateway temporary runner
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          role: temporary
          tool: mcp-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make -C mcp-gateway test-serve-temporary

  vulnerability-scan:
    name: Vulnerability scan (${{ matrix.tool }})
    needs: changes
    if: needs.changes.outputs.tools != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
    env:
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          role: vulnerability
          tool: ${{ matrix.tool }}
      - run: go -C "$TOOL" tool govulncheck ./...

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - unit-tests
      - sandbox-manager-macos
      - integration-tests
      - e2e-tests
      - gateway-temporary
      - gateway-lint
      - vulnerability-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B .github/scripts/ci.py gate
