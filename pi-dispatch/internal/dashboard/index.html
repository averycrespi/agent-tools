<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Dispatch</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#101722;--panel2:#151f2d;--text:#e6edf3;--muted:#8b98a8;--line:#263244;--accent:#7dd3fc;--good:#86efac;--bad:#fca5a5;--warn:#fde68a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:#0b111a}h1{margin:0;font-size:20px;letter-spacing:.04em}h2,h3{margin:0 0 12px}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:28px;height:28px}.connection{display:flex;align-items:center;gap:8px}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}.status-dot.connected{background:var(--good)}.hint{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(320px,38%) 1fr;gap:12px;padding:12px;height:calc(100vh - 61px)}section{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.toolbar,.tabs,.logbar{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line);background:var(--panel2)}input,select,button{background:#0b111a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}button{cursor:pointer}.tabs button.active{border-color:var(--accent);color:var(--accent);background:#0d1b2a}.tasks{overflow:auto;height:calc(100% - 52px)}.task{display:grid;gap:4px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:12px}.task:hover{background:#172033}.task.selected{background:#22314a;box-shadow:inset 4px 0 0 var(--accent)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}.muted{color:var(--muted)}.chip{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px}.running{color:var(--accent)}.succeeded{color:var(--good)}.failed{color:var(--bad)}.detail{display:grid;grid-template-rows:auto 1fr;height:100%}.tab-panel{display:none;padding:14px;overflow:auto}.tab-panel.active{display:block}.grid{display:grid;grid-template-columns:minmax(100px,140px) minmax(0,1fr);gap:6px 12px}.grid>div{min-width:0;overflow-wrap:anywhere}.response{white-space:pre-wrap}.timeline{display:grid;gap:4px}.event{display:flex;align-items:center;gap:8px;min-width:0;border-left:3px solid var(--accent);padding:4px 0 4px 10px}.event-type{flex:0 0 auto;border-color:var(--accent);color:var(--accent)}.event-message{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event-time{flex:0 0 auto}.evt-good{border-left-color:var(--good)}.evt-good .event-type{border-color:var(--good);color:var(--good)}.evt-bad{border-left-color:var(--bad)}.evt-bad .event-type{border-color:var(--bad);color:var(--bad)}.evt-warn{border-left-color:var(--warn)}.evt-warn .event-type{border-color:var(--warn);color:var(--warn)}.evt-control .event-type{border-color:#c4b5fd;color:#c4b5fd}.logs-panel{display:none;grid-template-rows:auto 1fr;padding:0;overflow:hidden}.logs-panel.active{display:grid}.logbar #logstate{margin-left:auto}pre{margin:0;padding:12px;overflow:auto;background:#05070b;color:#d1d5db}.empty{padding:28px;color:var(--muted);text-align:center}@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}.detail{height:70vh}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="favicon.svg" alt="" class="brand-icon"><h1>Pi Dispatch</h1></div>
  <div class="connection"><span id="status-dot" class="status-dot"></span><span id="connection" class="hint mono">Disconnected</span></div>
</header>
<main class="layout">
  <section aria-label="Tasks">
    <div class="toolbar">
      <input id="search" aria-label="Search tasks" placeholder="Search tasks" autocomplete="off">
      <select id="status" aria-label="Filter by status"><option value="">all statuses</option></select>
    </div>
    <div id="tasks" class="tasks"><div class="empty">Loading tasks…</div></div>
  </section>
  <section class="detail" aria-label="Task detail">
    <nav class="tabs" aria-label="Task detail tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="events">Events</button>
      <button data-tab="logs">Logs</button>
    </nav>
    <div id="overview-panel" class="tab-panel active">
      <h2 id="detail-title">Select a task</h2>
      <div id="meta" class="grid"></div>
    </div>
    <div id="events-panel" class="tab-panel">
      <div id="events" class="timeline"><div class="empty">No task selected.</div></div>
    </div>
    <div id="logs-panel" class="logs-panel">
      <div class="logbar"><button id="stdout">stdout</button><button id="stderr">stderr</button><button id="refresh">refresh</button><span id="logstate" class="hint mono"></span></div>
      <pre id="log"></pre>
    </div>
  </section>
</main>
<script>
const tabs=['overview','events','logs'];
const initialTab=tabs.includes(location.hash.slice(1))?location.hash.slice(1):'overview';
const state={tasks:[],selected:null,stream:'stdout',tab:initialTab};
const $=id=>document.getElementById(id);
async function api(path){const r=await fetch(path);if(!r.ok)throw new Error(await r.text());return r.json();}
function cls(s){return 'chip '+String(s||'').toLowerCase();}
function fmt(t){return t?new Date(t).toLocaleString():'';}
function esc(value){return String(value??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function promptText(task){return (task.prompt_preview||'')+(task.prompt_truncated?' ...':'');}
function responseText(detail){return (detail.response_preview||'')+(detail.response_truncated?' ...':'');}
function eventClass(type){type=String(type||'').toLowerCase();if(type.includes('fail')||type.includes('error'))return 'evt-bad';if(type.includes('stop')||type.includes('cancel'))return 'evt-warn';if(type.includes('end')||type.includes('succeed')||type.includes('completed'))return 'evt-good';if(type.startsWith('control.'))return 'evt-control';return 'evt-neutral';}
function setTab(tab){if(!tabs.includes(tab))tab='overview';state.tab=tab;if(location.hash.slice(1)!==tab)history.replaceState(null,'','#'+tab);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.tab-panel,.logs-panel').forEach(p=>p.classList.toggle('active',p.id===tab+'-panel'));}
function renderTasks(){const q=$('search').value.toLowerCase(), status=$('status').value;const rows=state.tasks.filter(t=>(!status||t.status===status)&&JSON.stringify(t).toLowerCase().includes(q));$('tasks').innerHTML=rows.length?rows.map(t=>`<button class="task ${state.selected===t.id?'selected':''}" data-id="${esc(t.id)}"><div class="row"><strong class="mono">${esc(t.id)}</strong><span class="${esc(cls(t.status))}">${esc(t.status)}</span></div><div>${esc(t.repo_name)} <span class="muted mono">${esc(t.branch)}</span></div><div class="muted">updated ${esc(fmt(t.updated_at))}</div></button>`).join(''):'<div class="empty">No tasks match.</div>';document.querySelectorAll('.task').forEach(b=>b.onclick=()=>selectTask(b.dataset.id));}
async function loadTasks(){const data=await api('api/tasks');state.tasks=data.tasks||[];const statuses=[...new Set(state.tasks.map(t=>t.status))].sort();$('status').innerHTML='<option value="">all statuses</option>'+statuses.map(s=>`<option>${s}</option>`).join('');renderTasks();}
async function selectTask(id){state.selected=id;renderTasks();const d=await api('api/tasks/'+encodeURIComponent(id));$('detail-title').textContent=id;const r=d.latest_run||{}, response=responseText(d), meta={status:d.task.status,repo:d.task.repo_path,worktree:d.task.worktree_path,branch:d.task.branch,template:d.task.template_name||'',prompt:promptText(d.task),run:r.id||'',attempt:r.attempt||'',supervisor_pid:r.supervisor_pid||'',session:r.pi_session_file||'',exit_code:r.exit_code??'',error:r.error_message||''};if(response)meta.response=response;$('meta').innerHTML=Object.entries(meta).map(([k,v])=>`<div class="muted">${esc(k)}</div><div class="${k==='response'?'response':'mono'}">${esc(v)}</div>`).join('');await loadEvents();await loadLog();}
async function loadEvents(){const data=await api('api/tasks/'+encodeURIComponent(state.selected)+'/events?limit=100');$('events').innerHTML=(data.events||[]).map(e=>{const msg=e.message||e.payload_json||'';return `<div class="event ${eventClass(e.type)}" title="${esc(msg)}"><span class="mono event-id">#${esc(e.id)}</span><span class="chip event-type">${esc(e.type)}</span><span class="event-message">${esc(msg)}</span><span class="muted event-time">${esc(fmt(e.timestamp))}</span></div>`}).join('')||'<div class="empty">No events.</div>';}
async function loadLog(){if(!state.selected)return;const data=await api('api/tasks/'+encodeURIComponent(state.selected)+`/logs?stream=${state.stream}&limit=65536`);$('log').textContent=data.content||'';$('logstate').textContent=`${state.stream} ${data.next_offset}/${data.size}`;}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));window.addEventListener('hashchange',()=>setTab(location.hash.slice(1)));$('search').oninput=renderTasks;$('status').onchange=renderTasks;$('stdout').onclick=()=>{state.stream='stdout';loadLog()};$('stderr').onclick=()=>{state.stream='stderr';loadLog()};$('refresh').onclick=()=>state.selected&&selectTask(state.selected);
setTab(state.tab);
const es=new EventSource('events');es.onopen=()=>{$('status-dot').classList.add('connected');$('connection').textContent='Connected'};es.onerror=()=>{$('status-dot').classList.remove('connected');$('connection').textContent='Disconnected'};es.addEventListener('snapshot',async()=>{await loadTasks();if(state.selected)await selectTask(state.selected)});
loadTasks().catch(e=>{$('tasks').innerHTML='<div class="empty">'+e.message+'</div>'});
</script>
</body>
</html>
