<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Board</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#101722;--panel2:#151f2d;--text:#e6edf3;--muted:#8b98a8;--line:#263244;--accent:#7dd3fc;--good:#86efac;--bad:#fca5a5;--warn:#fde68a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:#0b111a}h1{margin:0;font-size:20px;letter-spacing:.04em}.hint{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(320px,38%) 1fr;gap:12px;padding:12px;height:calc(100vh - 61px)}section{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.toolbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);background:var(--panel2)}input,select,button{background:#0b111a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}button{cursor:pointer}.tasks{overflow:auto;height:calc(100% - 52px)}.task{display:grid;gap:4px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:12px}.task:hover,.task.selected{background:#172033}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:var(--muted)}.chip{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px}.running{color:var(--accent)}.succeeded{color:var(--good)}.failed{color:var(--bad)}.detail{display:grid;grid-template-rows:auto 1fr 220px;height:100%}.panel{padding:14px;overflow:auto;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}.timeline{display:grid;gap:8px}.event{border-left:3px solid var(--accent);padding-left:10px}.logs{display:grid;grid-template-rows:auto 1fr}.logbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}pre{margin:0;padding:12px;overflow:auto;background:#05070b;color:#d1d5db}.empty{padding:28px;color:var(--muted);text-align:center}@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}.detail{height:auto}}
</style>
</head>
<body>
<header>
  <div><h1>Dispatch Board</h1><div class="hint">Read-only Explorer for pd tasks, runs, events, and logs.</div></div>
  <div id="connection" class="hint mono">connecting…</div>
</header>
<main class="layout">
  <section aria-label="Tasks">
    <div class="toolbar">
      <input id="search" aria-label="Search tasks" placeholder="Search tasks" autocomplete="off">
      <select id="status" aria-label="Filter by status"><option value="">all statuses</option></select>
    </div>
    <div id="tasks" class="tasks"><div class="empty">Loading tasks…</div></div>
  </section>
  <section class="detail" aria-label="Task detail">
    <div class="panel">
      <div class="row"><h2 id="detail-title">Select a task</h2><span class="hint">Shows persisted state only; run <span class="mono">pd ps</span> or <span class="mono">pd status</span> for CLI reconciliation.</span></div>
      <div id="meta" class="grid"></div>
    </div>
    <div class="panel">
      <h3>Event Timeline</h3>
      <div id="events" class="timeline"><div class="empty">No task selected.</div></div>
    </div>
    <div class="logs">
      <div class="logbar"><button id="stdout">stdout</button><button id="stderr">stderr</button><button id="refresh">refresh</button><span id="logstate" class="hint mono"></span></div>
      <pre id="log"></pre>
    </div>
  </section>
</main>
<script>
const state={tasks:[],selected:null,stream:'stdout'};
const $=id=>document.getElementById(id);
async function api(path){const r=await fetch(path);if(!r.ok)throw new Error(await r.text());return r.json();}
function cls(s){return 'chip '+String(s||'').toLowerCase();}
function fmt(t){return t?new Date(t).toLocaleString():'';}
function renderTasks(){const q=$('search').value.toLowerCase(), status=$('status').value;const rows=state.tasks.filter(t=>(!status||t.status===status)&&JSON.stringify(t).toLowerCase().includes(q));$('tasks').innerHTML=rows.length?rows.map(t=>`<button class="task ${state.selected===t.id?'selected':''}" data-id="${t.id}"><div class="row"><strong class="mono">${t.id}</strong><span class="${cls(t.status)}">${t.status}</span></div><div>${t.repo_name} <span class="muted mono">${t.branch}</span></div><div class="muted">updated ${fmt(t.updated_at)}</div></button>`).join(''):'<div class="empty">No tasks match.</div>';document.querySelectorAll('.task').forEach(b=>b.onclick=()=>selectTask(b.dataset.id));}
async function loadTasks(){const data=await api('/api/tasks');state.tasks=data.tasks||[];const statuses=[...new Set(state.tasks.map(t=>t.status))].sort();$('status').innerHTML='<option value="">all statuses</option>'+statuses.map(s=>`<option>${s}</option>`).join('');renderTasks();}
async function selectTask(id){state.selected=id;renderTasks();const d=await api('/api/tasks/'+encodeURIComponent(id));$('detail-title').textContent=id;const r=d.latest_run||{};$('meta').innerHTML=Object.entries({status:d.task.status,repo:d.task.repo_path,worktree:d.task.worktree_path,branch:d.task.branch,template:d.task.template_name||'',prompt:d.task.prompt_preview||'',run:r.id||'',attempt:r.attempt||'',supervisor_pid:r.supervisor_pid||'',session:r.pi_session_file||'',exit_code:r.exit_code??'',error:r.error_message||''}).map(([k,v])=>`<div class="muted">${k}</div><div class="mono">${v}</div>`).join('');await loadEvents();await loadLog();}
async function loadEvents(){const data=await api('/api/tasks/'+encodeURIComponent(state.selected)+'/events?limit=100');$('events').innerHTML=(data.events||[]).map(e=>`<div class="event"><div class="mono">#${e.id} ${e.type}</div><div>${e.message||''}</div><div class="muted">${fmt(e.timestamp)}</div>${e.payload_json?`<pre>${e.payload_json}</pre>`:''}</div>`).join('')||'<div class="empty">No events.</div>';}
async function loadLog(){if(!state.selected)return;const data=await api('/api/tasks/'+encodeURIComponent(state.selected)+`/logs?stream=${state.stream}&limit=65536`);$('log').textContent=data.content||'';$('logstate').textContent=`${state.stream} ${data.next_offset}/${data.size}`;}
$('search').oninput=renderTasks;$('status').onchange=renderTasks;$('stdout').onclick=()=>{state.stream='stdout';loadLog()};$('stderr').onclick=()=>{state.stream='stderr';loadLog()};$('refresh').onclick=()=>state.selected&&selectTask(state.selected);
const es=new EventSource('/events');es.onopen=()=>{$('connection').textContent='live'};es.onerror=()=>{$('connection').textContent='reconnecting'};es.addEventListener('snapshot',async()=>{await loadTasks();if(state.selected)await selectTask(state.selected)});
loadTasks().catch(e=>{$('tasks').innerHTML='<div class="empty">'+e.message+'</div>'});
</script>
</body>
</html>
