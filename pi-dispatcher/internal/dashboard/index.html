<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Dispatcher</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b10;
        --panel: #101722;
        --panel-strong: #151f2d;
        --panel-sunken: #05070b;
        --text: #e6edf3;
        --muted: #8b98a8;
        --line: #263244;
        --product-accent: #7dd3fc;
        --product-accent-2: #38bdf8;
        --good: #86efac;
        --bad: #fca5a5;
        --warn: #fde68a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(
            circle at 14% 10%,
            rgba(125, 211, 252, 0.12),
            transparent 32rem
          ),
          radial-gradient(
            circle at 84% 18%,
            rgba(56, 189, 248, 0.08),
            transparent 28rem
          ),
          var(--bg);
        color: var(--text);
        font:
          14px/1.4 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(11, 17, 26, 0.92);
        backdrop-filter: blur(12px);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      h2,
      h3 {
        margin: 0 0 12px;
      }
      .brand,
      .connection,
      .row,
      .toolbar,
      .tabs,
      .logbar {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-icon {
        width: 28px;
        height: 28px;
      }
      .connection {
        color: var(--muted);
        font-size: 12px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bad);
        box-shadow: 0 0 0 4px rgba(252, 165, 165, 0.08);
      }
      .status-dot.connected {
        background: var(--good);
        box-shadow: 0 0 0 4px rgba(134, 239, 172, 0.08);
      }
      .hint,
      .muted {
        color: var(--muted);
      }
      .hint {
        font-size: 12px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 38%) 1fr;
        gap: 12px;
        padding: 12px;
        height: calc(100vh - 61px);
      }
      section {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(16, 23, 34, 0.92);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.18);
      }
      .toolbar,
      .tabs,
      .logbar {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(21, 31, 45, 0.94);
      }
      .toolbar {
        align-items: stretch;
        flex-wrap: wrap;
      }
      .toolbar-title {
        display: grid;
        flex: 1 1 100%;
        gap: 2px;
      }
      .toolbar-controls {
        display: flex;
        flex: 1 1 100%;
        gap: 10px;
      }
      .toolbar-controls input {
        flex: 1 1 auto;
        min-width: 0;
      }
      input,
      select,
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-sunken);
        color: var(--text);
        padding: 8px 10px;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      input:focus,
      select:focus,
      button:focus-visible {
        outline: 2px solid rgba(125, 211, 252, 0.4);
        outline-offset: 2px;
      }
      .tabs button.active {
        border-color: var(--product-accent);
        background: rgba(13, 27, 42, 0.92);
        color: var(--product-accent);
      }
      .tasks {
        min-height: 0;
        overflow: auto;
      }
      .task {
        display: grid;
        gap: 6px;
        width: 100%;
        padding: 13px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }
      .task:hover {
        background: rgba(34, 49, 74, 0.58);
      }
      .task.selected {
        background: rgba(34, 49, 74, 0.84);
        box-shadow: inset 4px 0 0 var(--product-accent);
      }
      .row {
        justify-content: space-between;
        min-width: 0;
      }
      .task-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
        color: #cbd5e1;
        font-size: 12px;
        white-space: nowrap;
      }
      .chip::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }
      .running {
        color: var(--product-accent);
      }
      .succeeded {
        color: var(--good);
      }
      .failed {
        color: var(--bad);
      }
      .master,
      .detail {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }
      .detail {
        height: 100%;
      }
      .tab-panel {
        display: none;
        padding: 14px;
        overflow: auto;
      }
      .tab-panel.active {
        display: block;
      }
      .grid {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 7px 12px;
      }
      .grid > div {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .grid > .muted {
        white-space: nowrap;
      }
      .response {
        white-space: pre-wrap;
      }
      .logs-panel {
        display: none;
        grid-template-rows: auto 1fr;
        padding: 0;
        overflow: hidden;
      }
      .logs-panel.active {
        display: grid;
      }
      .logbar #logstate {
        margin-left: auto;
      }
      pre {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel-sunken);
        color: #d1d5db;
        overflow: auto;
        padding: 12px;
      }
      .logs-panel pre {
        border: 0;
        border-radius: 0;
      }
      .empty {
        display: grid;
        place-items: center;
        padding: 28px;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
        }
        .detail {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="favicon.svg" alt="" class="brand-icon" />
        <h1>Pi Dispatcher</h1>
      </div>
      <div class="connection">
        <span id="status-dot" class="status-dot"></span
        ><span id="connection" class="hint mono">Disconnected</span>
      </div>
    </header>
    <main class="layout">
      <section class="master" aria-label="Tasks">
        <div class="toolbar">
          <div class="toolbar-title">
            <h2>Tasks</h2>
            <div id="task-count" class="hint">Loading...</div>
          </div>
          <div class="toolbar-controls">
            <input
              id="search"
              aria-label="Search tasks"
              placeholder="Search tasks"
              autocomplete="off"
            />
            <select id="status" aria-label="Filter by status">
              <option value="">all statuses</option>
            </select>
            <button id="refresh-tasks" type="button">Refresh</button>
          </div>
        </div>
        <div id="tasks" class="tasks">
          <div class="empty">Loading tasks…</div>
        </div>
      </section>
      <section class="detail" aria-label="Task detail">
        <nav class="tabs" aria-label="Task detail tabs">
          <button data-tab="overview" class="active">Overview</button>
          <button data-tab="logs">Logs</button>
        </nav>
        <div id="overview-panel" class="tab-panel active">
          <div id="empty-detail" class="empty">No task selected</div>
          <div id="meta" class="grid"></div>
        </div>
        <div id="logs-panel" class="logs-panel">
          <div class="logbar">
            <button id="stdout">stdout</button
            ><button id="stderr">stderr</button
            ><button id="refresh-log">Refresh</button
            ><span id="logstate" class="hint mono"></span>
          </div>
          <pre id="log"></pre>
        </div>
      </section>
    </main>
    <script>
      const tabs = ["overview", "logs"];
      const initialTab = tabs.includes(location.hash.slice(1))
        ? location.hash.slice(1)
        : "overview";
      const state = {
        tasks: [],
        selected: null,
        stream: "stdout",
        tab: initialTab,
      };
      const $ = (id) => document.getElementById(id);
      async function api(path) {
        const r = await fetch(path);
        if (!r.ok) throw new Error(await r.text());
        return r.json();
      }
      function cls(s) {
        return "chip " + String(s || "").toLowerCase();
      }
      function fmt(t) {
        if (!t) return "";
        const d = new Date(t);
        if (Number.isNaN(d.valueOf())) return "";
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }
      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }
      function promptText(task) {
        return (
          (task.prompt_preview || "") + (task.prompt_truncated ? " ..." : "")
        );
      }
      function responseText(detail) {
        return (
          (detail.response_preview || "") +
          (detail.response_truncated ? " ..." : "")
        );
      }
      function formatList(values) {
        return Array.isArray(values) ? values.join(", ") : "";
      }
      function formatDuration(seconds) {
        if (!seconds) return "";
        return seconds + "s";
      }
      function setTab(tab) {
        if (!tabs.includes(tab)) tab = "overview";
        state.tab = tab;
        if (location.hash.slice(1) !== tab)
          history.replaceState(null, "", "#" + tab);
        document
          .querySelectorAll("[data-tab]")
          .forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
        document
          .querySelectorAll(".tab-panel,.logs-panel")
          .forEach((p) =>
            p.classList.toggle("active", p.id === tab + "-panel"),
          );
      }
      function filteredTasks() {
        const q = $("search").value.toLowerCase(),
          status = $("status").value;
        return state.tasks.filter(
          (t) =>
            (!status || t.status === status) &&
            JSON.stringify(t).toLowerCase().includes(q),
        );
      }
      function clearSelectedTask() {
        state.selected = null;
        $("empty-detail").style.display = "grid";
        $("meta").innerHTML = "";
        $("log").textContent = "";
        $("logstate").textContent = "";
      }
      function renderTasks() {
        const rows = filteredTasks();
        const total = state.tasks.length;
        $("task-count").textContent =
          rows.length === total
            ? `${total} total`
            : `${rows.length} shown of ${total}`;
        $("tasks").innerHTML = rows.length
          ? rows
              .map(
                (t) =>
                  `<button class="task ${state.selected === t.id ? "selected" : ""}" data-id="${esc(t.id)}"><div class="row"><strong class="task-title mono">${esc(t.id)}</strong><span class="${esc(cls(t.status))}">${esc(t.status)}</span></div><div>${esc(t.repo_name)} <span class="muted mono">${esc(t.branch)}</span></div><div class="muted">Updated ${esc(fmt(t.updated_at))}</div></button>`,
              )
              .join("")
          : '<div class="empty">No tasks match.</div>';
        document
          .querySelectorAll(".task")
          .forEach((b) => (b.onclick = () => selectTask(b.dataset.id)));
      }
      async function loadTasks(options = {}) {
        const data = await api("api/tasks");
        state.tasks = data.tasks || [];
        const statuses = [...new Set(state.tasks.map((t) => t.status))].sort();
        const currentStatus = $("status").value;
        $("status").innerHTML =
          '<option value="">all statuses</option>' +
          statuses.map((s) => `<option>${s}</option>`).join("");
        if (statuses.includes(currentStatus)) $("status").value = currentStatus;
        renderTasks();
        if (options.selectLatest && !state.selected && state.tasks.length) {
          await selectTask(state.tasks[0].id);
        }
      }
      async function selectTask(id) {
        state.selected = id;
        renderTasks();
        await refreshSelectedTask();
        await loadLog();
      }
      async function refreshSelectedTask() {
        if (!state.selected) return;
        const d = await api("api/tasks/" + encodeURIComponent(state.selected));
        $("empty-detail").style.display = "none";
        const r = d.latest_run || {},
          agent = r.agent_options || {},
          response = responseText(d),
          meta = [
            ["Task ID", d.task.id],
            ["Status", d.task.status],
            ["Repo", d.task.repo_path],
            ["Worktree", d.task.worktree_path],
            ["Branch", d.task.branch],
            ["Cleanup Policy", d.task.worktree_cleanup_policy || ""],
            ["Cleanup Status", d.task.worktree_cleanup_status || ""],
            ["Cleanup Error", d.task.worktree_cleanup_error || ""],
            ["Cleanup Attempted", fmt(d.task.worktree_cleanup_attempted_at)],
            ["Worktree Removed", fmt(d.task.worktree_removed_at)],
            ["Prompt", promptText(d.task)],
            ["Run ID", r.id || ""],
            ["Attempt", r.attempt || ""],
            ["Started", fmt(r.started_at)],
            ["Updated", fmt(d.task.updated_at)],
            ["Ended", fmt(r.ended_at)],
            ["Supervisor PID", r.supervisor_pid || ""],
            ["Agent Provider", agent.provider || ""],
            ["Agent Model", agent.model || ""],
            ["Agent Thinking", agent.thinking || ""],
            ["Agent Tools", formatList(agent.tools)],
            [
              "Disable Builtin Tools",
              agent.disable_builtin_tools ? "true" : "",
            ],
            ["Disable All Tools", agent.disable_all_tools ? "true" : ""],
            ["Agent Extensions", formatList(agent.extensions)],
            [
              "Disable Extensions",
              agent.disable_extension_discovery ? "true" : "",
            ],
            ["Agent Skills", formatList(agent.skills)],
            ["Disable Skills", agent.disable_skill_discovery ? "true" : ""],
            [
              "Disable Context Files",
              agent.disable_context_files ? "true" : "",
            ],
            ["Agent Session Dir", agent.session_dir || ""],
            ["Max Duration", formatDuration(r.max_duration_seconds)],
            ["Env", formatList(r.env_var_names)],
            ["Pi Output Logs", r.stdout_log_path || ""],
            ["Pi Error Logs", r.stderr_log_path || ""],
            ["Pi Events", r.pi_events_path || ""],
            ["Exit Code", r.exit_code ?? ""],
            ["Error", r.error_message || ""],
          ];
        if (response) meta.push(["Response", response]);
        $("meta").innerHTML = meta
          .filter(([, v]) => v !== "" && v !== undefined && v !== null)
          .map(
            ([label, v]) =>
              `<div class="muted">${esc(label)}</div><div class="${label === "Response" ? "response" : "mono"}">${esc(v)}</div>`,
          )
          .join("");
      }
      async function loadLog() {
        if (!state.selected) return;
        const data = await api(
          "api/tasks/" +
            encodeURIComponent(state.selected) +
            `/logs?stream=${state.stream}&limit=65536`,
        );
        $("log").textContent = data.content || "";
        $("logstate").textContent =
          `${state.stream} ${data.next_offset}/${data.size}`;
      }
      document
        .querySelectorAll("[data-tab]")
        .forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
      window.addEventListener("hashchange", () =>
        setTab(location.hash.slice(1)),
      );
      function handleTaskFilterChange() {
        if (
          state.selected &&
          !filteredTasks().some((t) => t.id === state.selected)
        ) {
          clearSelectedTask();
        }
        renderTasks();
      }
      $("search").oninput = handleTaskFilterChange;
      $("status").onchange = handleTaskFilterChange;
      $("stdout").onclick = () => {
        state.stream = "stdout";
        loadLog();
      };
      $("stderr").onclick = () => {
        state.stream = "stderr";
        loadLog();
      };
      $("refresh-tasks").onclick = async () => {
        await loadTasks({ selectLatest: !state.selected });
        if (state.selected) await refreshSelectedTask();
      };
      $("refresh-log").onclick = () =>
        state.selected && selectTask(state.selected);
      setTab(state.tab);
      const es = new EventSource("events");
      es.onopen = () => {
        $("status-dot").classList.add("connected");
        $("connection").textContent = "Connected";
      };
      es.onerror = () => {
        $("status-dot").classList.remove("connected");
        $("connection").textContent = "Disconnected";
      };
      es.addEventListener("snapshot", async () => {
        await loadTasks();
        if (state.selected) await refreshSelectedTask();
      });
      loadTasks({ selectLatest: true }).catch((e) => {
        $("tasks").innerHTML = '<div class="empty">' + e.message + "</div>";
      });
    </script>
  </body>
</html>
