<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Dispatcher</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b10;
        --panel: #101722;
        --panel-strong: #151f2d;
        --panel-sunken: #05070b;
        --text: #e6edf3;
        --muted: #8b98a8;
        --line: #263244;
        --product-accent: #7dd3fc;
        --product-accent-2: #38bdf8;
        --good: #86efac;
        --bad: #fca5a5;
        --warn: #fde68a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 14% 10%, rgba(125, 211, 252, 0.12), transparent 32rem),
          radial-gradient(circle at 84% 18%, rgba(56, 189, 248, 0.08), transparent 28rem),
          var(--bg);
        color: var(--text);
        font:
          14px/1.4 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(11, 17, 26, 0.92);
        backdrop-filter: blur(12px);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      h2,
      h3 {
        margin: 0 0 12px;
      }
      .brand,
      .connection,
      .row,
      .toolbar,
      .tabs,
      .logbar {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-icon {
        width: 28px;
        height: 28px;
      }
      .connection {
        color: var(--muted);
        font-size: 12px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bad);
        box-shadow: 0 0 0 4px rgba(252, 165, 165, 0.08);
      }
      .status-dot.connected {
        background: var(--good);
        box-shadow: 0 0 0 4px rgba(134, 239, 172, 0.08);
      }
      .hint,
      .muted {
        color: var(--muted);
      }
      .hint {
        font-size: 12px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 38%) 1fr;
        gap: 12px;
        padding: 12px;
        height: calc(100vh - 61px);
      }
      section {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(16, 23, 34, 0.92);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.18);
      }
      .toolbar,
      .tabs,
      .logbar {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(21, 31, 45, 0.94);
      }
      input,
      select,
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-sunken);
        color: var(--text);
        padding: 8px 10px;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      input:focus,
      select:focus,
      button:focus-visible {
        outline: 2px solid rgba(125, 211, 252, 0.4);
        outline-offset: 2px;
      }
      .tabs button.active {
        border-color: var(--product-accent);
        background: rgba(13, 27, 42, 0.92);
        color: var(--product-accent);
      }
      .tasks {
        min-height: 0;
        overflow: auto;
      }
      .task {
        display: grid;
        gap: 6px;
        width: 100%;
        padding: 13px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
      }
      .task:hover {
        background: rgba(34, 49, 74, 0.58);
      }
      .task.selected {
        background: rgba(34, 49, 74, 0.84);
        box-shadow: inset 4px 0 0 var(--product-accent);
      }
      .row {
        justify-content: space-between;
        min-width: 0;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
        color: #cbd5e1;
        font-size: 12px;
        white-space: nowrap;
      }
      .chip::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }
      .running {
        color: var(--product-accent);
      }
      .succeeded {
        color: var(--good);
      }
      .failed {
        color: var(--bad);
      }
      .master,
      .detail {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }
      .detail {
        height: 100%;
      }
      .tab-panel {
        display: none;
        padding: 14px;
        overflow: auto;
      }
      .tab-panel.active {
        display: block;
      }
      .grid {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 7px 12px;
      }
      .grid > div {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .grid > .muted {
        white-space: nowrap;
      }
      .response {
        white-space: pre-wrap;
      }
      .logs-panel {
        display: none;
        grid-template-rows: auto 1fr;
        padding: 0;
        overflow: hidden;
      }
      .logs-panel.active {
        display: grid;
      }
      .logbar #logstate {
        margin-left: auto;
      }
      pre {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel-sunken);
        color: #d1d5db;
        overflow: auto;
        padding: 12px;
      }
      .logs-panel pre {
        border: 0;
        border-radius: 0;
      }
      .empty {
        display: grid;
        place-items: center;
        padding: 28px;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
        }
        .detail {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="favicon.svg" alt="" class="brand-icon" />
        <h1>Pi Dispatcher</h1>
      </div>
      <div class="connection">
        <span id="status-dot" class="status-dot"></span
        ><span id="connection" class="hint mono">Disconnected</span>
      </div>
    </header>
    <main class="layout">
      <section class="master" aria-label="Tasks">
        <div class="toolbar">
          <input
            id="search"
            aria-label="Search tasks"
            placeholder="Search tasks"
            autocomplete="off"
          />
          <select id="status" aria-label="Filter by status">
            <option value="">all statuses</option>
          </select>
        </div>
        <div id="tasks" class="tasks">
          <div class="empty">Loading tasks…</div>
        </div>
      </section>
      <section class="detail" aria-label="Task detail">
        <nav class="tabs" aria-label="Task detail tabs">
          <button data-tab="overview" class="active">Overview</button>
          <button data-tab="logs">Logs</button>
        </nav>
        <div id="overview-panel" class="tab-panel active">
          <div id="empty-detail" class="empty">No task selected</div>
          <div id="meta" class="grid"></div>
        </div>
        <div id="logs-panel" class="logs-panel">
          <div class="logbar">
            <button id="stdout">stdout</button
            ><button id="stderr">stderr</button
            ><button id="refresh">refresh</button
            ><span id="logstate" class="hint mono"></span>
          </div>
          <pre id="log"></pre>
        </div>
      </section>
    </main>
    <script>
      const tabs = ["overview", "logs"];
      const initialTab = tabs.includes(location.hash.slice(1))
        ? location.hash.slice(1)
        : "overview";
      const state = {
        tasks: [],
        selected: null,
        stream: "stdout",
        tab: initialTab,
      };
      const $ = (id) => document.getElementById(id);
      async function api(path) {
        const r = await fetch(path);
        if (!r.ok) throw new Error(await r.text());
        return r.json();
      }
      function cls(s) {
        return "chip " + String(s || "").toLowerCase();
      }
      function fmt(t) {
        if (!t) return "";
        const d = new Date(t);
        return (
          d.toLocaleDateString(undefined, {
            year: "numeric",
            month: "numeric",
            day: "numeric",
          }) +
          " " +
          d.toLocaleTimeString(undefined, {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          })
        );
      }
      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }
      function promptText(task) {
        return (
          (task.prompt_preview || "") + (task.prompt_truncated ? " ..." : "")
        );
      }
      function responseText(detail) {
        return (
          (detail.response_preview || "") +
          (detail.response_truncated ? " ..." : "")
        );
      }
      function formatList(values) {
        return Array.isArray(values) ? values.join(", ") : "";
      }
      function formatDuration(seconds) {
        if (!seconds) return "";
        return seconds + "s";
      }
      function setTab(tab) {
        if (!tabs.includes(tab)) tab = "overview";
        state.tab = tab;
        if (location.hash.slice(1) !== tab)
          history.replaceState(null, "", "#" + tab);
        document
          .querySelectorAll("[data-tab]")
          .forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
        document
          .querySelectorAll(".tab-panel,.logs-panel")
          .forEach((p) =>
            p.classList.toggle("active", p.id === tab + "-panel"),
          );
      }
      function renderTasks() {
        const q = $("search").value.toLowerCase(),
          status = $("status").value;
        const rows = state.tasks.filter(
          (t) =>
            (!status || t.status === status) &&
            JSON.stringify(t).toLowerCase().includes(q),
        );
        $("tasks").innerHTML = rows.length
          ? rows
              .map(
                (t) =>
                  `<button class="task ${state.selected === t.id ? "selected" : ""}" data-id="${esc(t.id)}"><div class="row"><strong class="mono">${esc(t.id)}</strong><span class="${esc(cls(t.status))}">${esc(t.status)}</span></div><div>${esc(t.repo_name)} <span class="muted mono">${esc(t.branch)}</span></div><div class="muted">updated ${esc(fmt(t.updated_at))}</div></button>`,
              )
              .join("")
          : '<div class="empty">No tasks match.</div>';
        document
          .querySelectorAll(".task")
          .forEach((b) => (b.onclick = () => selectTask(b.dataset.id)));
      }
      async function loadTasks() {
        const data = await api("api/tasks");
        state.tasks = data.tasks || [];
        const statuses = [...new Set(state.tasks.map((t) => t.status))].sort();
        $("status").innerHTML =
          '<option value="">all statuses</option>' +
          statuses.map((s) => `<option>${s}</option>`).join("");
        renderTasks();
      }
      async function selectTask(id) {
        state.selected = id;
        renderTasks();
        await refreshSelectedTask();
        await loadLog();
      }
      async function refreshSelectedTask() {
        if (!state.selected) return;
        const d = await api("api/tasks/" + encodeURIComponent(state.selected));
        $("empty-detail").style.display = "none";
        const r = d.latest_run || {},
          agent = r.agent_options || {},
          response = responseText(d),
          meta = {
            task_id: d.task.id,
            status: d.task.status,
            repo: d.task.repo_path,
            worktree: d.task.worktree_path,
            branch: d.task.branch,
            cleanup_policy: d.task.worktree_cleanup_policy || "",
            cleanup_status: d.task.worktree_cleanup_status || "",
            cleanup_error: d.task.worktree_cleanup_error || "",
            cleanup_attempted_at: fmt(d.task.worktree_cleanup_attempted_at),
            worktree_removed_at: fmt(d.task.worktree_removed_at),
            prompt: promptText(d.task),
            run_id: r.id || "",
            attempt: r.attempt || "",
            started_at: fmt(r.started_at),
            updated_at: fmt(d.task.updated_at),
            completed_at: fmt(r.ended_at),
            supervisor_pid: r.supervisor_pid || "",
            agent_provider: agent.provider || "",
            agent_model: agent.model || "",
            agent_thinking: agent.thinking || "",
            agent_tools: formatList(agent.tools),
            agent_no_builtin_tools: agent.disable_builtin_tools ? "true" : "",
            agent_no_tools: agent.disable_all_tools ? "true" : "",
            agent_extensions: formatList(agent.extensions),
            agent_no_extensions: agent.disable_extension_discovery
              ? "true"
              : "",
            agent_skills: formatList(agent.skills),
            agent_no_skills: agent.disable_skill_discovery ? "true" : "",
            agent_no_context_files: agent.disable_context_files ? "true" : "",
            agent_session_dir: agent.session_dir || "",
            max_duration: formatDuration(r.max_duration_seconds),
            env: formatList(r.env_var_names),
            pi_output_logs: r.stdout_log_path || "",
            pi_error_logs: r.stderr_log_path || "",
            pi_events: r.pi_events_path || "",
            exit_code: r.exit_code ?? "",
            error: r.error_message || "",
          };
        if (response) meta.response = response;
        $("meta").innerHTML = Object.entries(meta)
          .filter(([, v]) => v !== "" && v !== undefined && v !== null)
          .map(
            ([k, v]) =>
              `<div class="muted">${esc(k)}</div><div class="${k === "response" ? "response" : "mono"}">${esc(v)}</div>`,
          )
          .join("");
      }
      async function loadLog() {
        if (!state.selected) return;
        const data = await api(
          "api/tasks/" +
            encodeURIComponent(state.selected) +
            `/logs?stream=${state.stream}&limit=65536`,
        );
        $("log").textContent = data.content || "";
        $("logstate").textContent =
          `${state.stream} ${data.next_offset}/${data.size}`;
      }
      document
        .querySelectorAll("[data-tab]")
        .forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
      window.addEventListener("hashchange", () =>
        setTab(location.hash.slice(1)),
      );
      $("search").oninput = renderTasks;
      $("status").onchange = renderTasks;
      $("stdout").onclick = () => {
        state.stream = "stdout";
        loadLog();
      };
      $("stderr").onclick = () => {
        state.stream = "stderr";
        loadLog();
      };
      $("refresh").onclick = () => state.selected && selectTask(state.selected);
      setTab(state.tab);
      const es = new EventSource("events");
      es.onopen = () => {
        $("status-dot").classList.add("connected");
        $("connection").textContent = "Connected";
      };
      es.onerror = () => {
        $("status-dot").classList.remove("connected");
        $("connection").textContent = "Disconnected";
      };
      es.addEventListener("snapshot", async () => {
        await loadTasks();
        if (state.selected) await refreshSelectedTask();
      });
      loadTasks().catch((e) => {
        $("tasks").innerHTML = '<div class="empty">' + e.message + "</div>";
      });
    </script>
  </body>
</html>
